[project]
name = "mini-hermes"
version = "0.1.0"
description = "Mini Hermes: AI 模拟交易与策略验证系统"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "asyncpg>=0.30",
    "apscheduler>=3.11",
    "pandas>=2.2",
    "numpy>=2.0",
    "pandas-ta>=0.3.14b0",
    "pandas-market-calendars>=4.4",
    "httpx>=0.28",
    "loguru>=0.7",
    "python-dotenv>=1.0",
    "yfinance>=0.2.50",
    "anthropic>=0.40",
    "openai>=1.55",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
