{% extends "base.html" %}
{% block title %}新建项目 - NovelForge{% endblock %}
{% block content %}
<div class="page-header">
    <h1>✏️ 新建项目</h1>
    <a href="/projects" class="btn btn-secondary">← 返回</a>
</div>

<div class="card">
    <form method="POST" action="/projects/new">
        <div class="form-group">
            <label>项目名称 *</label>
            <input type="text" name="title" class="form-input" required placeholder="例如：《星穹之下》">
        </div>
        <div class="form-group">
            <label>一句话创意</label>
            <textarea name="idea" class="form-textarea" rows="3" placeholder="用一句话描述你的故事核心创意"></textarea>
            <div class="form-hint">AI 将基于此创意生成世界观、角色和情节</div>
        </div>
        <div class="grid-2">
            <div class="form-group">
                <label>类型</label>
                <select name="genre" class="form-select">
                    <option value="">请选择</option>
                    <option value="玄幻">玄幻</option>
                    <option value="仙侠">仙侠</option>
                    <option value="都市">都市</option>
                    <option value="科幻">科幻</option>
                    <option value="悬疑">悬疑</option>
                    <option value="言情">言情</option>
                    <option value="历史">历史</option>
                    <option value="奇幻">奇幻</option>
                    <option value="恐怖">恐怖</option>
                    <option value="其他">其他</option>
                </select>
            </div>
            <div class="form-group">
                <label>风格</label>
                <select name="style" class="form-select">
                    <option value="">请选择</option>
                    <option value="轻松幽默">轻松幽默</option>
                    <option value="深沉严肃">深沉严肃</option>
                    <option value="快节奏爽文">快节奏爽文</option>
                    <option value="细腻描写">细腻描写</option>
                    <option value="对话驱动">对话驱动</option>
                    <option value="意识流">意识流</option>
                    <option value="黑暗写实">黑暗写实</option>
                    <option value="经典文学">经典文学</option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label>目标字数</label>
            <input type="number" name="target_words" class="form-input" value="50000" min="1000" step="1000">
            <div class="form-hint">建议：短篇 1-5 万，中篇 10-30 万，长篇 50-200 万</div>
        </div>
        <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px;">
            <a href="/projects" class="btn btn-secondary">取消</a>
            <button type="submit" class="btn btn-primary">创建项目</button>
        </div>
    </form>
</div>
{% endblock %}
